<!DOCTYPE html><!--The <!DOCTYPE html> line tells the web browser that the document is written in modern HTML5. It forces the browser to render the page correctly using standard web rules rather than old, outdated formats. -->
<html lang="en"><!--The <html lang="en"> tag marks the official start of your webpage and tells the browser that the primary language of the content is English.-->
<head><!--The <head> tag contains hidden information (metadata) about your webpage that the browser and search engines need, but users cannot see on the actual page.-->
    <meta charset="UTF-8"><!--Ensures text symbols, emojis, and foreign characters display correctly.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Makes your website look good on mobile screens.-->
    <title>My Favourites</title><!--This sets the title of the webpage. “About Me” will appear in the browser tab, not as the main heading on the webpage.-->
</head><!--This closes the <head> section of the HTML document. Anything meant for the page's main visible content usually goes after this, inside the <body> section.-->
<body>
